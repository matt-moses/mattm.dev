<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1C2128"/>
    </pattern>
    <style>
      .trace-o { fill: none; stroke: #FF7A33; stroke-width: 3; }
      .trace-b { fill: none; stroke: #3FA9F5; stroke-width: 3; }
      .via     { fill: #0A0C0F; stroke: #8B929B; stroke-width: 1.6; }
      .pad-o   { fill: #FF7A33; }
      .pad-b   { fill: #3FA9F5; }
      .body    { fill: #12151A; stroke: #3A3F47; stroke-width: 2.5; }
      .chippad { fill: #565D67; }
      .word    { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace; font-weight: 700; }
      .word-a  { fill: #E4E7EB; }
      .word-b  { fill: #FF7A33; }
    </style>
  </defs>

  <!-- background with faint PCB dot-grid -->
  <rect x="0" y="0" width="640" height="200" fill="#0A0C0F"/>
  <rect x="0" y="0" width="230" height="200" fill="url(#grid)"/>

  <!-- incoming traces, right-angle / 45-degree PCB routing -->
  <path class="trace-o" d="M -10 74 H 46 L 62 90 H 74"/>
  <path class="trace-b" d="M -10 126 H 46 L 62 110 H 74"/>
  <circle class="via" cx="46" cy="74" r="4.5"/>
  <circle class="via" cx="46" cy="126" r="4.5"/>
  <circle class="pad-o" cx="74" cy="90" r="3.5"/>
  <circle class="pad-b" cx="74" cy="110" r="3.5"/>

  <!-- component body (IC / connector footprint) -->
  <rect class="body" x="112" y="58" width="80" height="84" rx="4"/>
  <path class="body" d="M 136 58 L 168 58 L 163 42 L 141 42 Z"/>

  <!-- chip corner pads -->
  <rect class="chippad" x="106" y="62" width="8" height="8"/>
  <rect class="chippad" x="106" y="132" width="8" height="8"/>
  <rect class="chippad" x="186" y="62" width="8" height="8"/>
  <rect class="chippad" x="186" y="132" width="8" height="8"/>

  <!-- 8 pins as SMD pads with short trace stubs, alternating pair colors -->
  <g>
    <path class="trace-o" d="M 192 68 H 208"/>
    <rect class="pad-o" x="206" y="65" width="14" height="6" rx="1.5"/>
    <path class="trace-b" d="M 192 80 H 208"/>
    <rect class="pad-b" x="206" y="77" width="14" height="6" rx="1.5"/>
    <path class="trace-o" d="M 192 92 H 208"/>
    <rect class="pad-o" x="206" y="89" width="14" height="6" rx="1.5"/>
    <path class="trace-b" d="M 192 104 H 208"/>
    <rect class="pad-b" x="206" y="101" width="14" height="6" rx="1.5"/>
    <path class="trace-o" d="M 192 116 H 208"/>
    <rect class="pad-o" x="206" y="113" width="14" height="6" rx="1.5"/>
    <path class="trace-b" d="M 192 128 H 208"/>
    <rect class="pad-b" x="206" y="125" width="14" height="6" rx="1.5"/>
    <path class="trace-o" d="M 192 140 H 208 V 132"/>
    <circle class="via" cx="208" cy="132" r="4"/>
    <path class="trace-b" d="M 192 96 H 200"/>
  </g>

  <!-- wordmark -->
  <text class="word word-a" x="248" y="128" font-size="56" letter-spacing="-1">mattm<tspan class="word-b">.dev</tspan></text>
</svg>
